<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Login - StudentMS Student Management System">
  <title>Student Login | StudentMS</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Top Navigation Link -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <a href="/" class="auth-link" style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        <a href="/register" class="auth-link" style="font-size: 0.85rem;">Register Here</a>
      </div>

      <!-- Brand Header -->
      <div class="auth-brand">
        <a href="/" style="text-decoration: none; color: inherit;">
          <div class="auth-brand-icon" style="margin: 0 auto 1rem auto;">
            <i class="fas fa-user-graduate"></i>
          </div>
        </a>
        <h2>Welcome Back</h2>
        <p>Sign in to your StudentMS Account</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="loginEmail" class="form-control" placeholder="name@university.edu" required>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
              <button type="button" class="toggle-password-btn" data-target="loginPassword" title="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="auth-options">
            <label>
              <input type="checkbox" id="rememberMe" checked>
              <span>Remember me</span>
            </label>
            <a href="#" class="auth-link" onclick="alert('Password reset link sent to registered email!')">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
            Sign In <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </form>

      <!-- Footer Link to Signup -->
      <div class="auth-footer-text">
        Don't have a student account? <a href="/register" class="auth-link">Register Here</a>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Auth Script -->
  <script src="/assets/js/auth.js"></script>
</body>
</html>
