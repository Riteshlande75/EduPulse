<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Registration - StudentMS Student Management System">
  <title>Student Registration | StudentMS</title>
  
  <!-- Tailwind CSS CDN & Exact Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#181216',
              secondary: '#0F0F11',
              card: 'rgba(15, 15, 17, 0.85)',
              'card-hover': 'rgba(24, 18, 22, 0.95)',
              glass: 'rgba(24, 18, 22, 0.85)',
              accent: '#9D7E8F',
              'accent-hover': '#b595a6',
              border: 'rgba(157, 126, 143, 0.22)',
              text: '#EAEAEA',
              muted: '#9D7E8F',
              dim: '#7a6170',
              plum: '#9D7E8F',
              darkplum: '#181216',
              charcoal: '#0F0F11',
              rose: '#9D7E8F',
              'rose-light': '#C29BB0',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Top Navigation Link -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <a href="/" class="auth-link" style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        <a href="/login" class="auth-link" style="font-size: 0.85rem;">Sign In</a>
      </div>

      <!-- Brand Header -->
      <div class="auth-brand">
        <a href="/" style="text-decoration: none; color: inherit;">
          <div class="auth-brand-icon" style="margin: 0 auto 1rem auto;">
            <i class="fas fa-user-plus"></i>
          </div>
        </a>
        <h2>Create Student Account</h2>
        <p>Register your student profile on StudentMS</p>
      </div>

      <!-- Signup Form -->
      <form id="signupForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="signupName">Full Name *</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="signupName" class="form-control" placeholder="e.g. Alex Johnson" required>
            </div>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email Address *</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="signupEmail" class="form-control" placeholder="alex@university.edu" required>
            </div>
          </div>

          <div class="form-group">
            <label for="signupCourse">Academic Course / Program *</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-graduation-cap input-icon"></i>
              <select id="signupCourse" class="form-control">
                <option value="Computer Science">Computer Science</option>
                <option value="Data Science">Data Science</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Cyber Security">Cyber Security</option>
                <option value="Information Technology">Information Technology</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password *</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="signupPassword" class="form-control" placeholder="At least 6 characters" required>
              <button type="button" class="toggle-password-btn" data-target="signupPassword" title="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password *</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-check-double input-icon"></i>
              <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Re-enter password" required>
              <button type="button" class="toggle-password-btn" data-target="signupConfirmPassword" title="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="signupSubmitBtn" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
            Create Account <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </form>

      <!-- Footer Link to Login -->
      <div class="auth-footer-text">
        Already have a student account? <a href="/login" class="auth-link">Sign In Here</a>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Auth Script -->
  <script src="/assets/js/auth.js"></script>
</body>
</html>
